<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BulbApps — bright ideas, useful apps.">
  <meta name="theme-color" content="#fff7c2">
  <title>BulbApps — Coming Soon</title>
  <style>
    :root{
      --yellow:#ffd83d;
      --yellow2:#ffb91f;
      --blue:#1677ff;
      --ink:#172033;
      --muted:#697386;
      --bg:#fffdf5;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:
      radial-gradient(circle at 50% 20%,#fff6b8 0,rgba(255,246,184,.35) 18%,transparent 42%),
      var(--bg);
    }
    main{width:min(920px,92vw); text-align:center; padding:48px 24px 56px}
    .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:28px;letter-spacing:-1px}
    .mini-bulb{width:38px;height:38px;border-radius:50% 50% 45% 45%;background:linear-gradient(145deg,#ffe96a,var(--yellow2));position:relative;box-shadow:0 6px 18px #ffc52d55}
    .mini-bulb:after{content:"";position:absolute;left:10px;right:10px;bottom:-8px;height:10px;border-radius:0 0 7px 7px;background:#687384}
    .hero{margin:42px auto 0}
    .bulb{width:min(250px,58vw);margin:0 auto 26px;filter:drop-shadow(0 18px 20px #d99b2733)}
    h1{font-size:clamp(44px,8vw,76px);line-height:.95;margin:0;font-weight:850;letter-spacing:-4px}
    h1 span{color:var(--blue)}
    .tag{font-size:clamp(19px,3vw,27px);margin:18px 0 10px;font-weight:650}
    .copy{max-width:540px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.65}
    .pill{display:inline-block;margin-top:28px;padding:10px 17px;border-radius:999px;background:#fff;border:1px solid #eee4b7;font-size:14px;font-weight:700;color:#5d6472}
    footer{margin-top:54px;color:#9aa1ad;font-size:13px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mini-bulb"></span>BulbApps</div>

    <section class="hero">
      <svg class="bulb" viewBox="0 0 300 320" role="img" aria-label="Happy light bulb mascot">
        <defs>
          <linearGradient id="g" x1="20%" y1="10%" x2="80%" y2="90%">
            <stop offset="0" stop-color="#fff06a"/><stop offset="1" stop-color="#ffb51f"/>
          </linearGradient>
        </defs>
        <g stroke="#172033" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M65 112C65 52 111 23 151 23s84 30 84 89c0 43-20 65-39 82-9 8-13 17-13 30h-64c0-13-5-23-14-31-20-18-40-39-40-81Z" fill="url(#g)"/>
          <path d="M119 226h66v17h-66zM121 244h62v17h-62zM128 262h48v17h-48z" fill="#aeb7c4"/>
          <path d="M111 121c13-15 31-20 47-18" fill="none" stroke="#fff8c5" stroke-width="10"/>
          <ellipse cx="124" cy="122" rx="15" ry="21" fill="#fff"/>
          <ellipse cx="175" cy="122" rx="15" ry="21" fill="#fff"/>
          <circle cx="128" cy="126" r="6" fill="#172033" stroke="none"/>
          <circle cx="179" cy="126" r="6" fill="#172033" stroke="none"/>
          <path d="M119 160c17 16 42 16 61 0" fill="none"/>
          <path d="M69 175l-30 29M231 175l32-27" fill="none"/>
          <path d="M39 204l-17 8M263 148l14-7" fill="none" stroke="#1677ff"/>
          <path d="M28 72l-13-13M151 10V-2M266 65l13-14" fill="none" stroke="#ffb51f"/>
        </g>
        <g fill="#fff" stroke="#172033" stroke-width="6">
          <path d="M17 210c-10 0-14 10-6 17l20 14c7 5 16 0 14-8l-5-17c-2-5-13-6-23-6Z"/>
          <path d="M276 121c9-4 16 4 12 12l-14 26c-4 7-14 6-17-1l-6-14c-3-7 3-14 11-13l14 2Z"/>
        </g>
        <path d="M91 296h45M164 296h45" stroke="#172033" stroke-width="8" stroke-linecap="round"/>
      </svg>

      <h1>Bulb<span>Apps</span></h1>
      <div class="tag">Bright ideas. Useful apps.</div>
      <p class="copy">We're putting a little more light into the apps we use every day. Something fun and useful is coming soon.</p>
      <div class="pill">Coming soon</div>
    </section>

    <footer>© 2026 BulbApps</footer>
  </main>
</body>
</html>
